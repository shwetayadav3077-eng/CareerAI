{% extends "base.html" %}
{% block title %}Profile - CareerAI360{% endblock %}

{% block content %}
<div class="card">
    <h1>My Profile</h1>
    <br>
    <p><strong>Name:</strong> {{ user.name }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Account Created:</strong> {{ user.created_at }}</p>
    <br>
    <a class="btn" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</div>
{% endblock %}
